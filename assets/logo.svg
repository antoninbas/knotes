<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Knotes app icon. Rounded square in the dark-theme accent blue with
       a hand-drawn "K" as paths so vertical centering is exact across
       SVG renderers (librsvg, browsers, Inkscape). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#74c7ec"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <g fill="#11111b">
    <!-- Vertical stroke of the K -->
    <rect x="128" y="120" width="56" height="272" rx="6" ry="6"/>
    <!-- Upper arm: diagonal from middle of vertical up to top-right -->
    <path d="M 184 240 L 320 120 L 384 120 L 220 264 Z"/>
    <!-- Lower leg: diagonal from middle of vertical down to bottom-right -->
    <path d="M 184 272 L 220 248 L 384 392 L 320 392 Z"/>
  </g>
</svg>
