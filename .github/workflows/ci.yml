name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: cd src/web/app && npm install
      - run: npx tsc --noEmit
      - run: cd src/web/app && npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: cd src/web/app && npm install
      - name: Cache qmd models
        uses: actions/cache@v4
        with:
          path: ~/.cache/qmd/models
          key: qmd-models-v1
      - run: npx vitest run

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Cache qmd models
        uses: actions/cache@v4
        with:
          path: ~/.cache/qmd/models
          key: qmd-models-v1
      # qmd refuses LLM ops when CI=true. Override so embed/vector/hybrid run.
      - run: npx vitest run --config vitest.e2e.config.ts
        env:
          CI: ""

  install-npm-global:
    name: Test npm global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: cd src/web/app && npm install && npx vite build
      - run: npm run build
      - run: npm pack
      - run: npm install -g ./antoninbas-knotes-*.tgz
      - run: knotes --help

  install-bun-global:
    name: Test bun global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install
      - run: cd src/web/app && bun install && bunx vite build
      - run: npm run build
      - run: npm pack
      - name: Install globally
        run: bun install -g "$(pwd)/$(ls antoninbas-knotes-*.tgz)"
      - run: knotes --help

  test-homebrew-formula:
    name: Simulate Homebrew formula install (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew Node
        run: brew install node
      - name: Install and run via Homebrew Node (mimics formula)
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "1"
        run: |
          BREW_PREFIX="$(brew --prefix node)"
          export npm_config_nodedir="$BREW_PREFIX"
          "$BREW_PREFIX/bin/npm" install
          cd src/web/app && "$BREW_PREFIX/bin/npm" install && "$BREW_PREFIX/bin/npx" vite build
          cd ../../..
          "$BREW_PREFIX/bin/node" scripts/build.js
          "$BREW_PREFIX/bin/npm" prune --omit=dev
          # Run via Homebrew node exactly as the formula shim does
          "$BREW_PREFIX/bin/node" dist/main.js --help

  lockfile-check:
    name: Verify lock files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - name: Check root lock files
        run: |
          npm ci --ignore-scripts
          bun install --frozen-lockfile
      - name: Check frontend lock files
        run: |
          cd src/web/app
          npm ci --ignore-scripts
          bun install --frozen-lockfile
