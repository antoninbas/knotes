name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: cd src/web/app && npm install
      - run: npx tsc --noEmit
      - run: cd src/web/app && npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: cd src/web/app && npm install
      - name: Cache qmd models
        uses: actions/cache@v4
        with:
          path: ~/.cache/qmd/models
          key: qmd-models-v1
      - run: npx vitest run

  install-npm-global:
    name: Test npm global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: cd src/web/app && npm install && npx vite build
      - run: npm pack
      - run: npm install -g ./antoninbas-knotes-*.tgz
      - run: knotes --help

  install-bun-global:
    name: Test bun global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install
      - run: cd src/web/app && bun install && bunx vite build
      - run: npm pack
      - name: Install globally
        run: bun install -g "$(pwd)/$(ls antoninbas-knotes-*.tgz)"
      - run: knotes --help
