name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: cd src/web/app && npm install
      - run: npx tsc --noEmit
      - run: cd src/web/app && npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: cd src/web/app && npm install
      - name: Cache qmd models
        uses: actions/cache@v4
        with:
          path: ~/.cache/qmd/models
          key: qmd-models-v1
      - run: npx vitest run

  install-script-npm:
    name: Test install script (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test install from source
        run: |
          ./scripts/install.sh --prefix /tmp/knotes-npm --npm --local
      - name: Verify install
        run: |
          export PATH="/tmp/knotes-npm/bin:$PATH"
          knotes --help

  install-npm-global:
    name: Test npm global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: cd src/web/app && npm install && npx vite build
      - run: npm pack
      - run: npm install -g ./antoninbas-knotes-*.tgz
      - run: knotes --help

  install-script-bun:
    name: Test install script (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test install from source
        run: |
          ./scripts/install.sh --prefix /tmp/knotes-bun --local
      - name: Verify install
        run: |
          export PATH="/tmp/knotes-bun/bin:$PATH"
          knotes --help

  install-bun-global:
    name: Test bun global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install
      - run: cd src/web/app && bun install && bunx vite build
      - run: npm pack
      - run: bun add -g ./antoninbas-knotes-*.tgz
      - run: knotes --help

  install-homebrew:
    name: Test Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source tarball
        run: |
          VERSION="0.0.0-ci"
          git archive --format=tar.gz --prefix="knotes-${VERSION}/" HEAD > "/tmp/knotes-${VERSION}.tar.gz"
          SHA256=$(shasum -a 256 "/tmp/knotes-${VERSION}.tar.gz" | cut -d' ' -f1)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"
      - name: Generate and install formula
        run: |
          cat > /tmp/knotes.rb <<RUBY
          class Knotes < Formula
            desc "Local-first note and activity log manager with hybrid search"
            homepage "https://github.com/antoninbas/knotes"
            url "file:///tmp/knotes-${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", "--production"
              cd "src/web/app" do
                system "npm", "install"
                system "npx", "vite", "build"
              end

              libexec.install Dir["src", "package.json", "package-lock.json", "node_modules"]
              (libexec/"src/web/app/node_modules").install Dir["src/web/app/node_modules/*"] if Dir.exist?("src/web/app/node_modules")

              (bin/"knotes").write <<~SH
                #!/bin/sh
                exec npx tsx "#{libexec}/src/main.ts" "$@"
              SH
            end

            test do
              assert_match "knotes", shell_output("#{bin}/knotes --help")
            end
          end
          RUBY
          brew install --formula /tmp/knotes.rb
      - name: Verify install
        run: knotes --help
