name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: cd src/web/app && npm install
      - run: npx tsc --noEmit
      - run: cd src/web/app && npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: cd src/web/app && npm install
      - name: Cache qmd models
        uses: actions/cache@v4
        with:
          path: ~/.cache/qmd/models
          key: qmd-models-v1
      - run: npx vitest run

  install-script-npm:
    name: Test install script (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test install from source
        run: |
          ./scripts/install.sh --prefix /tmp/knotes-npm --npm --local
      - name: Verify install
        run: |
          export PATH="/tmp/knotes-npm/bin:$PATH"
          knotes --help

  install-npm-global:
    name: Test npm global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: cd src/web/app && npm install && npx vite build
      - run: npm pack
      - run: npm install -g ./antoninbas-knotes-*.tgz
      - run: knotes --help
