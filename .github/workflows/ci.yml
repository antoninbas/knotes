name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: cd src/web/app && bun install
      - run: bun tsc --noEmit
      - run: cd src/web/app && bunx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: cd src/web/app && bun install
      - name: Cache qmd models
        uses: actions/cache@v4
        with:
          path: ~/.cache/qmd/models
          key: qmd-models-v1
      - run: bun test
